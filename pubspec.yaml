name: ble_device_simulator
description: >-
  Simulated Bluetooth LE heart-rate, blood pressure, thermometer, pulse
  oximeter, power meter, foot pod and scale devices that send spec-correct
  GATT bytes. Build and test BLE apps without hardware.
version: 0.1.0
repository: https://github.com/ChandraChaan/ble_device_simulator
issue_tracker: https://github.com/ChandraChaan/ble_device_simulator/issues
topics:
  - bluetooth
  - ble
  - testing
  - health
  - fitness

environment:
  sdk: ^3.5.0

dependencies:
  meta: ^1.11.0

dev_dependencies:
  ble_gatt_parser: ^0.1.0
  lints: ">=5.0.0 <7.0.0"
  test: ^1.25.0
